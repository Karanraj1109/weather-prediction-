<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuaca - Modern App</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* === CSS VARIABLES & RESET === */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
            
            /* Background Gradients */
            --bg-night: linear-gradient(135deg, #0b1021 0%, #1b2845 100%);
            --bg-clear: linear-gradient(135deg, #4A90E2 0%, #87CEEB 100%);
            --bg-cloudy: linear-gradient(135deg, #606c88 0%, #3f4c6b 100%);
            --bg-rain: linear-gradient(135deg, #2b323c 0%, #4a5568 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-night);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background 1s ease;
        }

        /* === DYNAMIC BACKGROUND EFFECTS === */
        #bg-effects {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite ease-in-out alternate;
            opacity: 0;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            filter: blur(10px);
            animation: floatCloud 20s infinite linear;
            display: none;
        }

        .rain-drop {
            position: absolute;
            background: rgba(255, 255, 255, 0.5);
            width: 2px;
            height: 15px;
            animation: fallRain 1s infinite linear;
            display: none;
        }

        @keyframes twinkle { 0% { opacity: 0.2; } 100% { opacity: 0.8; transform: scale(1.2); } }
        @keyframes floatCloud { 0% { transform: translateX(-100px); } 100% { transform: translateX(100vw); } }
        @keyframes fallRain { 0% { transform: translateY(-20px); opacity: 1; } 100% { transform: translateY(100vh); opacity: 0; } }

        /* === APP CONTAINER (Mobile Feel) === */
        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 450px; /* Lebar maksimal untuk desktop */
            height: 100vh;
            max-height: 900px;
            overflow-y: auto;
            background: transparent;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scrollbar-width: none; /* Firefox */
        }
        .app-container::-webkit-scrollbar { display: none; } /* Chrome/Safari */

        /* === GLASSMORPHISM CARDS === */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        /* === HEADER & SEARCH === */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .location-info {
            display: flex;
            flex-direction: column;
        }
        .city-name { font-size: 1.5rem; font-weight: 600; display: flex; align-items: center; gap: 8px;}
        .real-time { font-size: 0.85rem; color: var(--text-muted); }
        .icon-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: white;
            width: 45px; height: 45px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.2); }

        .search-box {
            display: flex;
            gap: 10px;
        }
        .search-box input {
            flex: 1;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 12px 20px;
            color: white;
            outline: none;
            font-size: 1rem;
        }
        .search-box input::placeholder { color: var(--text-muted); }

        /* === MAIN WEATHER === */
        .main-weather {
            text-align: center;
            padding: 30px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .weather-icon-large { font-size: 80px; margin-bottom: 10px; filter: drop-shadow(0 0 15px rgba(255,255,255,0.3));}
        .temperature {
            font-size: 6rem;
            font-weight: 300;
            line-height: 1;
            position: relative;
        }
        .temperature span {
            font-size: 2rem;
            position: absolute;
            top: 15px;
        }
        .weather-status { font-size: 1.2rem; font-weight: 500; text-transform: capitalize; margin-top: 10px;}

        /* === AQI & DETAILS GRID === */
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .detail-item {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .detail-icon { font-size: 1.5rem; color: var(--text-muted); width: 30px; text-align: center;}
        .detail-info p { font-size: 0.85rem; color: var(--text-muted); }
        .detail-info h4 { font-size: 1.1rem; font-weight: 600; }

        /* AQI Circular Progress */
        .aqi-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .aqi-circle {
            width: 60px; height: 60px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            background: conic-gradient(#4caf50 0% 100%);
            position: relative;
        }
        .aqi-inner {
            width: 48px; height: 48px;
            background: rgba(30, 40, 60, 0.8);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-weight: 700;
        }

        /* === HORIZONTAL FORECAST (HOURLY) === */
        .section-title { font-size: 1rem; font-weight: 600; margin-bottom: 15px; }
        .hourly-scroll {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
        }
        .hourly-scroll::-webkit-scrollbar { display: none; }
        .hourly-item {
            min-width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .hourly-item i { font-size: 1.5rem; }

        /* === DAILY FORECAST === */
        .daily-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .daily-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .daily-item .day { flex: 1; font-weight: 500; }
        .daily-item .icon { flex: 1; text-align: center; font-size: 1.2rem;}
        .daily-item .temps { flex: 1; text-align: right; font-weight: 600; }
        .temps span { color: var(--text-muted); margin-left: 10px; font-weight: 400;}

        /* === LOADING & ERROR OVERLAY === */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 16, 33, 0.9);
            backdrop-filter: blur(10px);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: inherit;
        }
        .loader {
            border: 4px solid var(--glass-border);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        
        #error-msg { text-align: center; padding: 20px; color: #ff6b6b; font-weight: 500; max-width: 80%;}
    </style>
</head>
<body>

    <div id="bg-effects">
        </div>

    <div class="app-container">
        
        <div id="loading-overlay" class="overlay">
            <div class="loader" id="spinner"></div>
            <p id="error-msg" class="hidden">Gagal mengambil data. Periksa koneksi atau API Key.</p>
        </div>

        <div class="header">
            <div class="location-info">
                <div class="city-name"><i class="fa-solid fa-location-dot"></i> <span id="ui-city">Memuat...</span></div>
                <div class="real-time" id="ui-time">Sen, 1 Jan | 00:00</div>
            </div>
            <div>
                <button class="icon-btn" onclick="refreshWeather()" title="Refresh"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
        </div>

        <div class="search-box glass-card">
            <input type="text" id="search-input" placeholder="Cari kota lain..." onkeypress="handleSearch(event)">
            <button class="icon-btn" onclick="triggerSearch()" style="border:none; width:45px; height:45px;"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div class="main-weather glass-card">
            <i id="ui-main-icon" class="fa-solid fa-cloud weather-icon-large"></i>
            <div class="temperature"><span id="ui-temp">0</span><span>°</span></div>
            <div class="weather-status" id="ui-desc">Memuat data cuaca...</div>
        </div>

        <div class="glass-card aqi-container">
            <div>
                <h4 style="font-weight: 500; margin-bottom: 5px;">Kualitas Udara (AQI)</h4>
                <p id="ui-aqi-desc" style="font-size: 0.9rem; color: var(--text-muted);">Menganalisis...</p>
            </div>
            <div class="aqi-circle" id="ui-aqi-ring">
                <div class="aqi-inner" id="ui-aqi-val">-</div>
            </div>
        </div>

        <div class="details-grid">
            <div class="glass-card detail-item">
                <div class="detail-icon"><i class="fa-solid fa-droplet"></i></div>
                <div class="detail-info">
                    <p>Kelembapan</p>
                    <h4 id="ui-humidity">0%</h4>
                </div>
            </div>
            <div class="glass-card detail-item">
                <div class="detail-icon"><i class="fa-solid fa-wind"></i></div>
                <div class="detail-info">
                    <p>Angin</p>
                    <h4 id="ui-wind">0 km/h</h4>
                </div>
            </div>
            <div class="glass-card detail-item">
                <div class="detail-icon"><i class="fa-solid fa-sunrise"></i></div>
                <div class="detail-info">
                    <p>Terbit</p>
                    <h4 id="ui-sunrise">--:--</h4>
                </div>
            </div>
            <div class="glass-card detail-item">
                <div class="detail-icon"><i class="fa-solid fa-sunset"></i></div>
                <div class="detail-info">
                    <p>Terbenam</p>
                    <h4 id="ui-sunset">--:--</h4>
                </div>
            </div>
        </div>

        <div class="glass-card">
            <div class="section-title">Prediksi Per Jam</div>
            <div class="hourly-scroll" id="ui-hourly">
                </div>
        </div>

        <div class="glass-card">
            <div class="section-title">Prediksi 5 Hari</div>
            <div class="daily-list" id="ui-daily">
                </div>
        </div>

    </div>

    <script>
        // ==========================================
        // KONFIGURASI API (GANTI DENGAN API KEY ANDA)
        // ==========================================
        const API_KEY = "MASUKKAN_API_KEY"; 
        
        // Menggunakan localStorage untuk mengingat kota terakhir yang dicari
        // Default menggunakan kota relevan atau Jakarta
        let currentCity = localStorage.getItem('lastCity') || 'Medan';

        // DOM Elements
        const el = {
            overlay: document.getElementById('loading-overlay'),
            spinner: document.getElementById('spinner'),
            errorMsg: document.getElementById('error-msg'),
            time: document.getElementById('ui-time'),
            city: document.getElementById('ui-city'),
            temp: document.getElementById('ui-temp'),
            desc: document.getElementById('ui-desc'),
            mainIcon: document.getElementById('ui-main-icon'),
            humidity: document.getElementById('ui-humidity'),
            wind: document.getElementById('ui-wind'),
            sunrise: document.getElementById('ui-sunrise'),
            sunset: document.getElementById('ui-sunset'),
            aqiRing: document.getElementById('ui-aqi-ring'),
            aqiVal: document.getElementById('ui-aqi-val'),
            aqiDesc: document.getElementById('ui-aqi-desc'),
            hourly: document.getElementById('ui-hourly'),
            daily: document.getElementById('ui-daily'),
            bgEffects: document.getElementById('bg-effects'),
            searchInput: document.getElementById('search-input')
        };

        // Realtime Clock
        function updateClock() {
            const now = new Date();
            const days = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
            const day = days[now.getDay()];
            const date = now.getDate();
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
            const month = months[now.getMonth()];
            
            let h = now.getHours().toString().padStart(2, '0');
            let m = now.getMinutes().toString().padStart(2, '0');
            
            el.time.innerText = `${day}, ${date} ${month} | ${h}:${m}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Initialize App
        async function init() {
            if (API_KEY === "MASUKKAN_API_KEY") {
                showError("API_KEY belum dimasukkan.<br>Silakan edit file HTML dan masukkan OpenWeatherMap API Key Anda.");
                return;
            }
            await fetchWeatherData(currentCity);
        }

        // Fetch Data from OpenWeatherMap
        async function fetchWeatherData(city) {
            showLoading(true);
            try {
                // 1. Current Weather
                const currRes = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric&lang=id`);
                if (!currRes.ok) throw new Error('Kota tidak ditemukan');
                const currData = await currRes.json();

                const lat = currData.coord.lat;
                const lon = currData.coord.lon;

                // 2. Forecast (5 Days / 3 Hours)
                const forecastRes = await fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=id`);
                const forecastData = await forecastRes.json();

                // 3. Air Pollution (AQI)
                const aqiRes = await fetch(`https://api.openweathermap.org/data/2.5/air_pollution?lat=${lat}&lon=${lon}&appid=${API_KEY}`);
                const aqiData = await aqiRes.json();

                // Simpan kota berhasil dicari
                currentCity = currData.name;
                localStorage.setItem('lastCity', currentCity);
                
                updateUI(currData, forecastData, aqiData);
                showLoading(false);

            } catch (error) {
                showError(error.message);
            }
        }

        // Update UI Elements
        function updateUI(curr, forecast, aqiData) {
            // Main info
            el.city.innerText = curr.name;
            el.temp.innerText = Math.round(curr.main.temp);
            el.desc.innerText = curr.weather[0].description;
            
            // Icon handling based on OpenWeatherMap icon codes
            const iconClass = getWeatherIcon(curr.weather[0].icon);
            el.mainIcon.className = `fa-solid ${iconClass} weather-icon-large`;

            // Details
            el.humidity.innerText = `${curr.main.humidity}%`;
            el.wind.innerText = `${Math.round(curr.wind.speed * 3.6)} km/h`; // m/s to km/h
            el.sunrise.innerText = formatTime(curr.sys.sunrise, curr.timezone);
            el.sunset.innerText = formatTime(curr.sys.sunset, curr.timezone);

            // AQI (1: Good, 2: Fair, 3: Moderate, 4: Poor, 5: Very Poor)
            const aqi = aqiData.list[0].main.aqi;
            const aqiConfig = getAQIConfig(aqi);
            el.aqiVal.innerText = aqi;
            el.aqiDesc.innerText = aqiConfig.text;
            el.aqiDesc.style.color = aqiConfig.color;
            el.aqiRing.style.background = `conic-gradient(${aqiConfig.color} ${aqi * 20}%, transparent 0)`;

            // Hourly Forecast (Next 24 hours = 8 data points)
            el.hourly.innerHTML = '';
            const hourlyData = forecast.list.slice(0, 8);
            hourlyData.forEach(item => {
                const time = item.dt_txt.split(' ')[1].substring(0, 5);
                const temp = Math.round(item.main.temp);
                const icon = getWeatherIcon(item.weather[0].icon);
                
                const html = `
                    <div class="hourly-item">
                        <span style="font-size: 0.85rem; color: var(--text-muted);">${time}</span>
                        <i class="fa-solid ${icon}"></i>
                        <span style="font-weight: 600;">${temp}°</span>
                    </div>
                `;
                el.hourly.innerHTML += html;
            });

            // Daily Forecast (Filter 1 data per hari, misal jam 12:00)
            el.daily.innerHTML = '';
            const dailyData = forecast.list.filter(item => item.dt_txt.includes("12:00:00"));
            const daysArr = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            
            dailyData.forEach(item => {
                const date = new Date(item.dt_txt);
                const dayName = daysArr[date.getDay()];
                const icon = getWeatherIcon(item.weather[0].icon);
                const tempMax = Math.round(item.main.temp_max);
                const tempMin = Math.round(item.main.temp_min); // OpenWeather gratis biasanya suhu sama, ini aproksimasi

                const html = `
                    <div class="daily-item">
                        <div class="day">${dayName}</div>
                        <div class="icon"><i class="fa-solid ${icon}"></i></div>
                        <div class="temps">${tempMax}° <span>${tempMin - 2}°</span></div>
                    </div>
                `;
                el.daily.innerHTML += html;
            });

            // Change Background based on weather and time
            updateBackgroundAndEffects(curr.weather[0].icon, curr.weather[0].id);
        }

        // --- Helper Functions ---

        function formatTime(unix, timezoneOffset) {
            // Konversi ke UTC lalu tambahkan timezone offset lokasi
            const date = new Date((unix + timezoneOffset) * 1000);
            let h = date.getUTCHours().toString().padStart(2, '0');
            let m = date.getUTCMinutes().toString().padStart(2, '0');
            return `${h}:${m}`;
        }

        function getWeatherIcon(iconCode) {
            const map = {
                '01d': 'fa-sun', '01n': 'fa-moon',
                '02d': 'fa-cloud-sun', '02n': 'fa-cloud-moon',
                '03d': 'fa-cloud', '03n': 'fa-cloud',
                '04d': 'fa-cloud', '04n': 'fa-cloud',
                '09d': 'fa-cloud-showers-heavy', '09n': 'fa-cloud-showers-heavy',
                '10d': 'fa-cloud-sun-rain', '10n': 'fa-cloud-moon-rain',
                '11d': 'fa-bolt', '11n': 'fa-bolt',
                '13d': 'fa-snowflake', '13n': 'fa-snowflake',
                '50d': 'fa-smog', '50n': 'fa-smog'
            };
            return map[iconCode] || 'fa-cloud';
        }

        function getAQIConfig(aqi) {
            switch(aqi) {
                case 1: return { text: 'Sangat Baik', color: '#4caf50' };
                case 2: return { text: 'Cukup Baik', color: '#8bc34a' };
                case 3: return { text: 'Sedang', color: '#ffeb3b' };
                case 4: return { text: 'Buruk', color: '#ff9800' };
                case 5: return { text: 'Sangat Buruk', color: '#f44336' };
                default: return { text: 'Tidak Diketahui', color: '#9e9e9e' };
            }
        }

        // --- Dynamic Background & Animations ---

        function updateBackgroundAndEffects(icon, id) {
            const body = document.body;
            el.bgEffects.innerHTML = ''; // Bersihkan efek sebelumnya
            
            const isDay = icon.includes('d');

            if (id >= 200 && id < 600) {
                // Rain / Drizzle / Thunderstorm
                body.style.background = 'var(--bg-rain)';
                createRain();
                createClouds(3, isDay);
            } else if (id === 800) {
                // Clear
                if (isDay) {
                    body.style.background = 'var(--bg-clear)';
                } else {
                    body.style.background = 'var(--bg-night)';
                    createStars();
                }
            } else if (id > 800) {
                // Clouds
                body.style.background = 'var(--bg-cloudy)';
                createClouds(5, isDay);
                if (!isDay) createStars(20); // Sedikit bintang jika berawan malam
            }
        }

        function createStars(count = 50) {
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `${Math.random() * 100}vh`;
                star.style.animationDelay = `${Math.random() * 2}s`;
                el.bgEffects.appendChild(star);
            }
        }

        function createClouds(count = 3, isDay) {
            for (let i = 0; i < count; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                cloud.style.display = 'block';
                const width = Math.random() * 150 + 100;
                cloud.style.width = `${width}px`;
                cloud.style.height = `${width * 0.4}px`;
                cloud.style.top = `${Math.random() * 40}vh`; // Awan di bagian atas
                cloud.style.animationDuration = `${Math.random() * 20 + 20}s`;
                cloud.style.background = isDay ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.1)';
                el.bgEffects.appendChild(cloud);
            }
        }

        function createRain(count = 100) {
            for (let i = 0; i < count; i++) {
                const drop = document.createElement('div');
                drop.className = 'rain-drop';
                drop.style.display = 'block';
                drop.style.left = `${Math.random() * 100}vw`;
                drop.style.animationDuration = `${Math.random() * 0.5 + 0.5}s`;
                drop.style.animationDelay = `${Math.random()}s`;
                el.bgEffects.appendChild(drop);
            }
        }

        // --- User Actions ---

        function handleSearch(e) {
            if (e.key === 'Enter') {
                triggerSearch();
            }
        }

        function triggerSearch() {
            const val = el.searchInput.value.trim();
            if (val) {
                fetchWeatherData(val);
                el.searchInput.value = '';
            }
        }

        function refreshWeather() {
            fetchWeatherData(currentCity);
        }

        function showLoading(isLoading) {
            if (isLoading) {
                el.overlay.classList.remove('hidden');
                el.spinner.classList.remove('hidden');
                el.errorMsg.classList.add('hidden');
            } else {
                el.overlay.classList.add('hidden');
            }
        }

        function showError(msg) {
            el.overlay.classList.remove('hidden');
            el.spinner.classList.add('hidden');
            el.errorMsg.innerHTML = msg;
            el.errorMsg.classList.remove('hidden');
        }

        // Start App
        init();
    </script>
</body>
</html>
